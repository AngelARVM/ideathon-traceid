[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# Pinned: the deployed contract is non-upgradeable, so the exact compiler is part of its identity.
solc_version = "0.8.28"
# Hedera's EVM supports Cancun opcodes; Prague is not assumed.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
hedera_testnet = "https://testnet.hashio.io/api"

[fmt]
line_length = 120
